name: LarkBar
options:
  bundleIdPrefix: com.ubiqapps
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.0.2"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LarkBar:
    type: application
    platform: macOS
    sources:
      - LarkBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ubiqapps.larkbar
        PRODUCT_NAME: LarkBar
        INFOPLIST_FILE: LarkBar/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LarkBar/Resources/LarkBar.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # Anyone can build without an Apple account; release.sh re-signs with a Developer ID.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
  LarkBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LarkBarTests
    dependencies:
      - target: LarkBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ubiqapps.larkbar.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LarkBar.app/Contents/MacOS/LarkBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  LarkBar:
    build:
      targets:
        LarkBar: all
        LarkBarTests: [test]
    test:
      targets:
        - LarkBarTests
