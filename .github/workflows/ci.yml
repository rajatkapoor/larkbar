name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build and test
        run: |
          xcodebuild -project LarkBar.xcodeproj -scheme LarkBar -configuration Debug \
            -derivedDataPath build/DerivedData test CODE_SIGNING_ALLOWED=NO
